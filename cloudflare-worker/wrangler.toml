name = "fr24-search-proxy"
main = "worker.js"
compatibility_date = "2025-01-15"
workers_dev = true
preview_urls = false

# Workers Logs. The dashboard had this on; a deploy from a config without it
# turns it off.
[observability]
enabled = true

# Set the shared secret with:
#   wrangler secret put PROXY_SECRET
# (the binding name has no spaces — the dashboard-created one was " PROXY_SECRET",
# with a leading space, so the Worker never saw it). Then set FR24_PROXY_SECRET
# to the same value in Vercel env vars.
