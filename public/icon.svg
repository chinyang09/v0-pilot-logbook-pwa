<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .fg-stroke { stroke: #FFFFFF; fill: none; }
      .fg-line { stroke: #FFFFFF; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #FFFFFF; }
      .fg { fill: #000000; }
      .fg-stroke { stroke: #000000; fill: none; }
      .fg-line { stroke: #000000; }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="512" height="512" rx="80" />

  <!-- Horizon reference line -->
  <line class="fg-line" x1="0" y1="256" x2="512" y2="256" stroke-width="1" opacity="0.18" />

  <!-- O O O I -->

  <!-- First O: 40px diameter, center at (161, 256) -->
  <circle class="fg-stroke" cx="161" cy="256" r="20" stroke-width="4.5" />

  <!-- Second O: 50px diameter, center at (228, 256) -->
  <circle class="fg-stroke" cx="228" cy="256" r="25" stroke-width="4.5" />

  <!-- Third O: 60px diameter, center at (305, 256) -->
  <circle class="fg-stroke" cx="305" cy="256" r="30" stroke-width="4.5" />

  <!-- I: 14px wide, 60px tall, center at (364, 256) -->
  <rect class="fg" x="357" y="226" width="14" height="60" rx="7" />
</svg>
